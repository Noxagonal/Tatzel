name: Documentation and browser checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tatzel-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Check documentation contracts and links
        run: python3 tools/check_documentation.py
      - name: Build and test browser code
        run: |
          npm ci
          npm run build
          npm test
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
      - name: Generate static documentation
        run: python3 tools/build_documentation.py
      - uses: actions/upload-artifact@v4
        with:
          name: tatzel-documentation
          path: build/docs/html
          if-no-files-found: error

  cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install module build dependencies
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /usr/share/keyrings/llvm.asc >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' | sudo tee /etc/apt/sources.list.d/llvm-23.list
          sudo apt-get update
          sudo apt-get install -y clang-23 clang-tools-23 libclang-rt-23-dev libstdc++-13-dev ninja-build libssl-dev zlib1g-dev uuid-dev libsqlite3-dev
          curl -fL https://github.com/Kitware/CMake/releases/download/v4.0.7/cmake-4.0.7-linux-x86_64.tar.gz -o "$RUNNER_TEMP/cmake.tar.gz"
          tar -xzf "$RUNNER_TEMP/cmake.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-4.0.7-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Build application and core behavior checks
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++-23 -DCMAKE_BUILD_TYPE=Debug -DTATZEL_BUILD_TESTS=ON -DTATZEL_BUILD_SANITIZER_TESTS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Preserve runnable example for integration diagnostics
        run: |
          mkdir -p build/smoke-bundle/lib
          cp build/targets/development/TatzelDevelopment build/smoke-bundle/
          ldd build/targets/development/TatzelDevelopment | awk '/=> \// {print $3}' | xargs -r cp -t build/smoke-bundle/lib/
          cp -r build/targets/development/tatzel-runtime build/smoke-bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: tatzel-example-linux
          path: build/smoke-bundle
          if-no-files-found: error
      - name: Regenerate a deleted browser build output
        run: |
          rm www/app/main.js
          cmake --build build --target typescript_build
          test -s www/app/main.js
      - name: Check the running example over WebSocket
        run: |
          timeout 30s node tests/browser/server-smoke.mjs ./build/targets/development/TatzelDevelopment
          timeout 30s node tests/browser/forms-smoke.mjs ./build/targets/development/TatzelDevelopment
          timeout 30s node tests/browser/elements-smoke.mjs ./build/targets/development/TatzelDevelopment
          timeout 30s node tests/browser/removal-smoke.mjs ./build/targets/development/TatzelDevelopment
          timeout 30s node tests/browser/errors-smoke.mjs ./build/targets/development/TatzelDevelopment
          timeout 30s node tests/browser/dispatcher-smoke.mjs ./build/targets/development/TatzelDevelopment
          timeout 30s node tests/browser/reliability-smoke.mjs ./build/targets/development/TatzelDevelopment

          timeout 45s node tests/browser/workspace-smoke.mjs ./build/targets/workspace/TatzelWorkspace
      - name: Install and relocate the package, then build a separate consumer
        run: |
          python3 tools/check_package.py --build-directory build --work-directory "$RUNNER_TEMP/tatzel-package-check" --compiler clang++-23 --parallel 2
      - name: Install Chromium for the sample UI journey
        run: npx playwright install --with-deps chromium
      - name: Exercise the sample in a real browser
        run: |
          timeout 120s node tests/browser/workspace-ui.mjs ./build/targets/workspace/TatzelWorkspace
          timeout 90s node tests/browser/reliability-ui.mjs ./build/targets/development/TatzelDevelopment
          timeout 90s node tests/browser/components-ui.mjs ./build/targets/development/TatzelDevelopment
          timeout 90s node tests/browser/tables-ui.mjs ./build/targets/development/TatzelDevelopment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tatzel-workspace-preview
          path: build/workspace-preview
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tatzel-components-preview
          path: build/components-preview
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tatzel-table-preview
          path: build/table-preview
          if-no-files-found: ignore
