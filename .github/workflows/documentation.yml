name: Documentation and browser checks

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Check documentation contracts and links
        run: python3 tools/check_documentation.py
      - name: Build and test browser code
        run: |
          npm ci
          npm run build
          npm test
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
      - name: Generate static documentation
        run: python3 tools/build_documentation.py
      - uses: actions/upload-artifact@v4
        with:
          name: tatzel-documentation
          path: build/docs/html
          if-no-files-found: error
